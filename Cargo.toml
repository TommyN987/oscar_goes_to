[workspace]
resolver = "3"
members = ["crates/domain", "crates/application", "crates/adapters"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
# The one way to define an error type. Declared here because more than one crate uses it.
thiserror = "2.0.21"

[workspace.lints.rust]
unsafe_code = "forbid"
