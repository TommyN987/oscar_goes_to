[workspace]
resolver = "3"
members = ["crates/domain", "crates/application", "crates/adapters"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
# The one way to define an error type. Declared here because more than one crate uses it.
thiserror = "2.0.21"

[workspace.lints.rust]
unsafe_code = "forbid"

# Code that runs in production returns its failures; it does not panic on them.
# A call that cannot fail by construction carries `#[expect(clippy::expect_used, reason = "...")]`.
# clippy.toml lifts both lints inside tests, which fail by panicking.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
